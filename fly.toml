# Foothold on Fly.io (plan "Deployment"): a single machine that Fly suspends
# when idle and resumes on the next request (post-contest cost cut, 2026-09-23;
# resume is ~1s and sessions.db survives it), sessions.db on the /data volume,
# ANTHROPIC_API_KEY as the only secret (set via `fly secrets set`, never here).
# ONE machine is load-bearing: sessions.db is per-machine, so a second
# machine (fly deploy's HA default) round-robins sessions into 404s.
# Deploy with `make deploy` (fly deploy --ha=false), never bare `fly deploy`.
app = "foothold"
primary_region = "sjc"

[env]
  FOOTHOLD_SESSIONS_DB = "/data/sessions.db"
  FOOTHOLD_SECURE_COOKIES = "1"

[mounts]
  source = "foothold_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
