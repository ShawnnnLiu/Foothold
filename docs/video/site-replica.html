<title>Foothold demo video - offline site replica</title>
<!--
  Video production asset only. Not part of the product build (same rule as
  countdown-calendar.html and countdown-resolution.html).

  A single-file, fully offline replica of the Foothold user flow - landing,
  route picker, transcript entry, evaluation theater, triage wall, petition
  drawer - so the demo segment of the 2-min Pathfinders video can be screen
  recorded with wifi off. The two request-time LLM nodes are simulated with
  the product's real loading states, fixed deterministic delays, and canned
  outputs, so every take is identical.

  Ground truth:
  - Flow, markup, and CSS ported 1:1 from frontend/src (the screen state
    machine in App.tsx; the styles below are the product's stylesheets
    spliced verbatim). If the product changes, regenerate the CSS splice.
  - Data is the verified Maya Torres example
    (docs/video/demo-example-deanza-ucsd-cs.md): De Anza College ->
    UC San Diego, CSE: Computer Science B.S., 2025-2026, agreement
    76/113/to/7/Major/76ab1c59-2dcf-4c6f-f364-08ddd3b241a4. The evaluation
    JSON was produced by running the REAL deterministic evaluator
    (starmap.transfer.evaluate.build_evaluation) over the committed
    articulation.db, scoped to the major agreement per the demo doc's
    verified verdicts (dept agreements excluded: with them, CIS 22A finds
    dept-level matches such as CSE 8A and leaves the no-articulation
    bucket, contradicting the locked narrative - see the demo doc caveat).
  - Known replica deviations:
    (1) the still-owed CSE 11 card renders its course code and title; the
    live product's CourseCard renders only finding.detail for still-owed
    rows, which is null for single-course owed groups, leaving that card
    line blank (product gap, flagged 2026-08-07);
    (2) the petition letter is ONE canned draft (the default all-three
    selection); toggling drawer checkboxes re-runs the real drafting
    states but always yields that same letter, where the product would
    redraft for the new selection - the locked video flow never toggles.

  Operator controls (recorded takes are pure mouse interaction):
    R  reset to the landing        1-5  jump to a stage
    (1 landing, 2 picker, 3 entry, 4 triage, 5 petition drawer)
    T  copy Maya's transcript text to the clipboard for the paste beat
    H  show the control hint again
    ?speed=N scales the simulated waits, count-ups, and letter typing
    (CSS entrance/sheen animations stay at product timing).

  Fonts: docs/video/fonts.css inlined below (Archivo variable, OFL), so the
  page makes zero network requests of any kind.
-->

/* Ascent design tokens, exactly from docs/design/ASCENT.md. */

:root {
  --chalk: #F3F1EC;
  --slate: #272B31;
  --hold-teal: #0E8A6D;
  --hold-amber: #D97706;
  --hold-red: #B3372E;

  --radius: 4px;
  --border: 2px solid var(--slate);
  --shadow-offset: 4px 4px 0 var(--slate);
}

body {
  margin: 0;
  background: var(--chalk);
  color: var(--slate);
  font-family: 'Archivo', sans-serif;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0s !important;
    animation-delay: 0s !important;
    transition-duration: 0s !important;
  }
}
.wordmark {
  display: flex;
  align-items: flex-end;
}

.wordmark--lg {
  gap: 14px;
}

.wordmark--sm {
  gap: 8px;
}

.wordmark--link {
  cursor: pointer;
}

.wordmark__text {
  font-weight: 900;
  letter-spacing: 0.05em;
  line-height: 1;
}

.wordmark--lg .wordmark__text {
  font-size: 42px;
}

.wordmark--sm .wordmark__text {
  font-size: 19px;
}
.holdtile {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  border: 2px solid var(--slate);
  box-sizing: border-box;
}

.holdtile--chalk {
  border-color: var(--chalk);
}

.holdtile--shadow {
  box-shadow: 3px 3px 0 var(--slate);
}

.holdtile--transfers_clean {
  background: var(--hold-teal);
}

.holdtile--at_risk {
  background: var(--hold-amber);
}

.holdtile--no_articulation {
  background: var(--hold-red);
}

.holdtile--still_owed {
  background: var(--chalk);
  border-style: dashed;
  box-shadow: none;
}

.holdtile--still_owed.holdtile--chalk {
  background: none;
}

.holdtile__bang {
  color: #f3f1ec;
  font-weight: 900;
  font-size: 17px;
  line-height: 1;
}
.citation {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.citation--small {
  font-size: 10.5px;
  letter-spacing: 0.05em;
}

.citation--transfers_clean {
  box-shadow: inset 0 -6px 0 rgba(14, 138, 109, 0.35);
}

.citation--at_risk {
  box-shadow: inset 0 -5px 0 rgba(217, 119, 6, 0.4);
}

.citation--no_articulation {
  box-shadow: inset 0 -6px 0 rgba(179, 55, 46, 0.3);
}

.citation--still_owed {
  box-shadow: inset 0 -6px 0 rgba(39, 43, 49, 0.2);
}
.reasontag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 2px solid var(--hold-amber);
  border-radius: var(--radius);
  padding: 1px 6px;
  white-space: nowrap;
}
.errorbanner {
  background: var(--slate);
  color: var(--chalk);
  border: var(--border);
  border-radius: var(--radius);
  box-shadow: 4px 4px 0 var(--hold-red);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.errorbanner__text {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
}

.errorbanner__retry {
  font-family: inherit;
  background: var(--chalk);
  color: var(--slate);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 2px solid var(--chalk);
  border-radius: var(--radius);
  cursor: pointer;
}
/* The Gold finish and Prism lines texture are fixed by the ASCENT.md foil
   amendment; values translated from the prototype's FOILS/TEX tables.
   The Rainbow finish (second amendment, 2026-08-03) is reserved for the
   landing demo button: same metallic structure, holographic hue band, plus a
   slow CSS-keyframe drift so it shines at rest (deterministic, no PRNG). */

.foil {
  --rx: 0deg;
  --ry: 0deg;
  --mx: 50%;
  --my: 50%;
  --ga: 100deg;
  --ft: 0.45s;
  --persp: 700px;
  position: relative;
  transform: perspective(var(--persp)) rotateX(var(--rx)) rotateY(var(--ry));
  transform-style: preserve-3d;
  transition: transform var(--ft) ease-out;
  background: linear-gradient(
    180deg,
    #fdebbe 0%,
    #edad3f 16%,
    #ce8412 48%,
    #a96606 80%,
    #ebb856 100%
  );
  color: #38220a;
  font-family: inherit;
  font-weight: 900;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 2px solid var(--slate);
  border-radius: var(--radius);
  box-shadow:
    5px 5px 0 var(--slate),
    inset 0 1px 0 rgba(255, 255, 255, 0.85),
    inset 0 0 0 1px rgba(255, 244, 214, 0.5),
    inset 0 -3px 5px rgba(80, 40, 0, 0.35);
  cursor: pointer;
  white-space: nowrap;
}

.foil:active:not(:disabled) {
  transform: perspective(var(--persp)) rotateX(var(--rx)) rotateY(var(--ry)) scale(0.96);
}

.foil--lg {
  font-size: 15px;
  padding: 15px 26px;
}

.foil--md {
  font-size: 14px;
  padding: 14px 24px;
}

.foil--sm {
  --persp: 600px;
  font-size: 13px;
  padding: 14px 16px;
  width: 100%;
  text-align: center;
}

.foil--chalk {
  border-color: var(--chalk);
  box-shadow:
    4px 4px 0 var(--chalk),
    inset 0 1px 0 rgba(255, 255, 255, 0.85),
    inset 0 0 0 1px rgba(255, 244, 214, 0.5),
    inset 0 -3px 5px rgba(80, 40, 0, 0.45);
}

.foil--rainbow {
  background: linear-gradient(
    110deg,
    #f6a9b8 0%,
    #f7c98b 16%,
    #f3e88f 32%,
    #9fe0a8 48%,
    #8fd0f0 64%,
    #a9a3ef 80%,
    #eb9ede 96%,
    #f6a9b8 100%
  );
  background-size: 240% 240%;
  animation: foil-rainbow-drift 8s ease-in-out infinite alternate;
  color: #33203a;
  box-shadow:
    5px 5px 0 var(--slate),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 0 0 1px rgba(255, 240, 250, 0.55),
    inset 0 -3px 5px rgba(70, 30, 90, 0.3);
}

@keyframes foil-rainbow-drift {
  from {
    background-position: 0% 50%;
  }
  to {
    background-position: 100% 50%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .foil--rainbow {
    animation: none;
  }
}

.foil--rainbow:disabled {
  animation: none;
}

.foil--rainbow .foil__sheen {
  opacity: 0.5;
}

.foil--rainbow .foil__label {
  text-shadow: 0 1px 0 rgba(255, 245, 255, 0.55);
}

/* The Chrome finish (Chrome-CTA amendment, 2026-08-04): the prototype's
   Chrome FOILS row, reserved for the landing CTA placements. Same metallic
   structure and pointer-driven sheen; cool ink and neutral insets. */
.foil--chrome {
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #dee6ee 16%,
    #a9b7c7 48%,
    #7e8ea0 80%,
    #eaf0f6 100%
  );
  color: #1b242e;
  box-shadow:
    5px 5px 0 var(--slate),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 0 0 1px rgba(238, 244, 250, 0.55),
    inset 0 -3px 5px rgba(27, 36, 46, 0.35);
}

.foil--chrome .foil__sheen {
  opacity: 0.4;
}

.foil--chrome .foil__label {
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
}

/* The landing pill shape (2026-08-04 amendment): the export's borderless
   999px-radius CTA with its soft blur shadow, sentence-case label, and the
   same Gold gradient/sheen structure. Landing page only. */
.foil--pill {
  border: 0;
  border-radius: 999px;
  text-transform: none;
  letter-spacing: normal;
  font-weight: 800;
  box-shadow:
    0 4px 14px rgba(10, 30, 26, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.85),
    inset 0 0 0 1px rgba(255, 244, 214, 0.5),
    inset 0 -3px 5px rgba(80, 40, 0, 0.35);
}

.foil--pill.foil--md {
  font-size: 15px;
  padding: 14px 28px;
}

.foil--pill.foil--lg {
  font-size: 15.5px;
  padding: 15px 32px;
  box-shadow:
    0 4px 14px rgba(39, 43, 49, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.85),
    inset 0 0 0 1px rgba(255, 244, 214, 0.5),
    inset 0 -3px 5px rgba(80, 40, 0, 0.35);
}

.foil--pill .foil__sheen,
.foil--pill .foil__glare,
.foil--pill .foil__tex {
  border-radius: 999px;
}

/* Pill + Chrome: the pill's soft blur shadow with the neutral chrome insets
   (declared after the pill rules so the cool tints win the cascade). */
.foil--pill.foil--chrome {
  box-shadow:
    0 4px 14px rgba(10, 30, 26, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 0 0 1px rgba(238, 244, 250, 0.55),
    inset 0 -3px 5px rgba(27, 36, 46, 0.35);
}

.foil--pill.foil--lg.foil--chrome {
  box-shadow:
    0 4px 14px rgba(39, 43, 49, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 0 0 1px rgba(238, 244, 250, 0.55),
    inset 0 -3px 5px rgba(27, 36, 46, 0.35);
}

.foil__sheen,
.foil__glare,
.foil__tex {
  position: absolute;
  inset: 0;
  border-radius: 2px;
  pointer-events: none;
}

.foil__sheen {
  mix-blend-mode: color-dodge;
  opacity: 0.35;
  background: linear-gradient(
    var(--ga),
    rgba(255, 0, 170, 0) calc(var(--mx) - 45%),
    rgba(255, 0, 170, 0.4) calc(var(--mx) - 22%),
    rgba(0, 255, 255, 0.45) var(--mx),
    rgba(255, 215, 0, 0.4) calc(var(--mx) + 22%),
    rgba(255, 0, 170, 0) calc(var(--mx) + 45%)
  );
}

.foil__glare {
  mix-blend-mode: overlay;
  opacity: 0.5;
  background: radial-gradient(
    circle at var(--mx) var(--my),
    rgba(255, 255, 255, 0.8),
    rgba(255, 255, 255, 0) 55%
  );
}

.foil__tex {
  mix-blend-mode: overlay;
  opacity: 0.7;
  background-image: repeating-linear-gradient(
    115deg,
    rgba(255, 255, 255, 0.35) 0px,
    rgba(255, 255, 255, 0.35) 1px,
    rgba(255, 255, 255, 0) 1px,
    rgba(255, 255, 255, 0) 4px
  );
}

.foil__label {
  position: relative;
  display: block;
  transform: translateZ(16px);
  text-shadow: 0 1px 0 rgba(255, 248, 225, 0.5);
}

.foil:disabled {

  color: rgba(39, 43, 49, 0.5);
  border-color: rgba(39, 43, 49, 0.3);
  box-shadow: none;
  transform: none;
  cursor: default;
}

.foil--chalk:disabled {
  background: rgba(243, 241, 236, 0.15);
  color: rgba(243, 241, 236, 0.5);
  border-color: rgba(243, 241, 236, 0.3);
}

.foil:disabled .foil__label {
  transform: none;
  text-shadow: none;
}
@keyframes fh-stepin {
  from {
    opacity: 0;
    transform: scaleX(0);
  }
  to {
    opacity: 1;
    transform: scaleX(1);
  }
}

@keyframes fh-rise {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}

@keyframes fh-sweep {
  from {
    background-position:
      -150% 0,
      0 0;
  }
  to {
    background-position:
      250% 0,
      0 0;
  }
}

/* The ambient sidebar loop holds at both ends so the sweep occupies only the
   18%-62% window of each cycle. */
@keyframes fh-wallsheen {
  0%,
  18% {
    background-position:
      -150% 0,
      0 0;
  }
  62%,
  100% {
    background-position:
      250% 0,
      0 0;
  }
}

/* The chance-event flash (prototype `_nextEvent`): a fast holo sweep with a
   mid-flight brightness/saturation spike, applied imperatively by
   WallChart.tsx. */
@keyframes fh-holoflash {
  0% {
    background-position:
      -160% 0,
      0 0;
  }
  45% {
    filter: brightness(1.4) saturate(2);
  }
  100% {
    background-position:
      260% 0,
      0 0;
    filter: brightness(1) saturate(1);
  }
}

.wall--sidebar {
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
}

.wall--sidebar .wall__step {
  width: 96px;
  height: 22px;
  border-radius: 2px;
  box-sizing: border-box;
  transform-origin: left;
  animation-name: fh-stepin;
  animation-duration: 0.35s;
  animation-fill-mode: both;
}

/* The marketing landing's stat-band wall: the export's step geometry, chalk
   borders like the sidebar (it also sits on slate). No chance events ever. */
.wall--landing {
  display: flex;
  flex-direction: column-reverse;
  gap: 5px;
}

.wall--landing .wall__step {
  width: 120px;
  height: 24px;
  border-radius: 2px;
  box-sizing: border-box;
  transform-origin: left;
  animation-name: fh-stepin;
  animation-duration: 0s;
  animation-fill-mode: both;
}

.wall--theater {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 190px;
}

.wall--theater .wall__step {
  border-radius: 3px;
  box-sizing: border-box;
  transform-origin: bottom;
  animation-name: fh-rise;
  animation-duration: 0.45s;
  animation-fill-mode: both;
}

/* Secure: teal fill; the white sweep rides as the first background layer,
   second animation slot. Highlight strength differs per variant in the
   prototype: .55 in the theater, .5 on the sidebar wall. */
.wall__step--secure {
  border: 2px solid var(--slate);
  background:
    linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.55) 50%,
        rgba(255, 255, 255, 0) 70%
      )
      no-repeat -150% 0 / 250% 100%,
    var(--hold-teal);
}

.wall--sidebar .wall__step--secure,
.wall--landing .wall__step--secure {
  border-color: var(--chalk);
  background:
    linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 70%
      )
      no-repeat -150% 0 / 250% 100%,
    var(--hold-teal);
}

/* Reach: the doc-00 rule-3 translation, white/chalk fill with a 2px amber
   border (the prototype's chrome gradient never ships). The holographic sheen
   layer copies the prototype verbatim: .65/.35/.35 in the theater, .6/.3/.3
   on the sidebar wall. This base rule is the theater's: it sits on the chalk
   page ground, where a chalk fill disappears, so the fill is white (fourth
   ASCENT.md wall amendment, 2026-08-04); the slate-backed sidebar and
   landing walls override to chalk below, which reads white there. */
.wall__step--reach {
  border: 2px solid var(--hold-amber);
  background:
    linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.65) 42%,
        rgba(255, 0, 170, 0.35) 50%,
        rgba(0, 255, 255, 0.35) 58%,
        rgba(255, 255, 255, 0) 70%
      )
      no-repeat -150% 0 / 250% 100%,
    #fff;
}

.wall--sidebar .wall__step--reach,
.wall--landing .wall__step--reach {
  background:
    linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.6) 42%,
        rgba(255, 0, 170, 0.3) 50%,
        rgba(0, 255, 255, 0.3) 58%,
        rgba(255, 255, 255, 0) 70%
      )
      no-repeat -150% 0 / 250% 100%,
    var(--chalk);
}

/* Sheen durations and delays are per-step constants set inline by
   WallChart.tsx (prototype values, indexed by stable step position). The
   sidebar sheen loops forever; the theater sweep fires once. */
@media (prefers-reduced-motion: no-preference) {
  .wall--sidebar .wall__step--secure,
  .wall--sidebar .wall__step--reach,
  .wall--landing .wall__step--secure,
  .wall--landing .wall__step--reach {
    animation-name: fh-stepin, fh-wallsheen;
    animation-timing-function: ease, ease-in-out;
    animation-fill-mode: both, none;
    animation-iteration-count: 1, infinite;
  }

  .wall--theater .wall__step--secure,
  .wall--theater .wall__step--reach {
    animation-name: fh-rise, fh-sweep;
    animation-timing-function: ease, ease-in-out;
    animation-fill-mode: both, both;
  }
}

/* Owed: dashed outline, no fill, no sheen. */
.wall__step--owed {
  border: 2px dashed var(--slate);
  background: none;
}

.wall--sidebar .wall__step--owed,
.wall--landing .wall__step--owed {
  border-color: rgba(243, 241, 236, 0.8);
}

  max-width: 960px;
  margin: -180px auto 0;
  padding: 0 36px;
}

.landing__mock {
  background: #fff;
  border-radius: 14px;
  box-shadow:
    0 6px 16px rgba(39, 43, 49, 0.08),
    0 30px 70px rgba(39, 43, 49, 0.18);
  overflow: hidden;
}

.landing__mockbar {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--slate);
  color: var(--chalk);
  padding: 12px 20px;
}

.landing__mockroute {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(243, 241, 236, 0.85);
}

.landing__mocktabs {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

.landing__mocktab {
  border: 1.5px solid rgba(243, 241, 236, 0.5);
  font-weight: 900;
  font-size: 9.5px;
  letter-spacing: 0.07em;
  padding: 5px 10px;
  border-radius: 3px;
}

.landing__mocktab--active {
  background: var(--chalk);
  color: var(--slate);
  border: 0;
  padding: 6.5px 10px;
}

.landing__mockboard {
  background: var(--chalk);
  padding: 22px 26px 26px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Landing.tsx sets --fh-stagger to the row's 28px-per-index offset; keeping
   the margin in CSS lets the narrow-viewport rules flatten it. */
.landing__mockrow {
  margin-left: var(--fh-stagger, 0px);
}

.landing__mockhead {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.landing__mockhead .holdtile--shadow {
  box-shadow: 2px 2px 0 var(--slate);
}

.landing__mocklabel {
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 0.05em;
}

.landing__mockcount {
  font-weight: 500;
  font-size: 9.5px;
  letter-spacing: 0.06em;
  color: rgba(39, 43, 49, 0.6);
}

.landing__mockcard {
  background: #fff;
  border: var(--border);
  border-radius: var(--radius);
  box-shadow: 3px 3px 0 var(--slate);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.landing__mockmain {
  flex: 1;
}

.landing__mockcourse {
  font-size: 12px;
}

.landing__code {
  font-weight: 800;
}

.landing__mockcite {
  margin-top: 4px;
}

.landing__mock .citation--small {
  font-size: 9px;
  letter-spacing: 0.06em;
}

.landing__mock .citation--transfers_clean {
  box-shadow: inset 0 -5px 0 rgba(14, 138, 109, 0.35);
}

.landing__mockfallback {
  font-size: 9px;
  margin-left: 8px;
  box-shadow: inset 0 -5px 0 rgba(179, 55, 46, 0.3);
}

.landing__mockunits {
  font-weight: 800;
  font-size: 11px;
}

.landing__mockgrid {
  background: #fff;
  border: var(--border);
  border-radius: var(--radius);
  box-shadow: 5px 5px 0 var(--hold-amber);
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.landing__mockcell {
  padding: 10px 13px;
}

.landing__mockcell:first-child {
  border-right: var(--border);
}

.landing__mockcell .landing__mockcourse {
  font-size: 11.5px;
}

.landing__mockmeta {
  margin-top: 4px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.landing__mock .reasontag {
  font-size: 8.5px;
  border-width: 1.5px;
  border-radius: 3px;
  padding: 1px 5px;
}

.landing__mocknote {
  font-size: 10px;
  color: rgba(39, 43, 49, 0.7);
}

/* ============ Social proof ============ */

.landing__proof {
  max-width: 1080px;
  margin: 0 auto;
  padding: 84px 36px 30px;
  text-align: center;
}

.landing__prooflabel {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(39, 43, 49, 0.45);
}

.landing__colleges {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px 40px;
  margin-top: 24px;
}

.landing__colleges span {
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.02em;
  color: rgba(39, 43, 49, 0.32);
}

/* ============ Feature sections ============ */

.landing__feature {
  max-width: 1080px;
  margin: 0 auto;
  padding: 110px 36px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 76px;
  align-items: center;
}

.landing__kicker {
  color: var(--hold-teal);

  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.landing__h2 {
  margin: 14px 0 0;
  font-weight: 900;
  font-size: 40px;
  line-height: 1.1;
  letter-spacing: -0.015em;
  text-wrap: pretty;
}

.landing__body {
  margin: 18px 0 0;
  font-size: 16.5px;
  line-height: 1.65;
  color: rgba(39, 43, 49, 0.68);
  text-wrap: pretty;
}

.landing a.landing__link {
  display: inline-block;
  margin-top: 18px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}

.landing a.landing__link:hover {
  color: var(--slate);
}

.landing__panel {
  background: var(--chalk);
  border-radius: 14px;
  box-shadow:
    0 6px 16px rgba(39, 43, 49, 0.08),
    0 24px 56px rgba(39, 43, 49, 0.14);
  padding: 26px;
  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;
}

.landing__panel:hover {
  transform: translateY(-4px);
  box-shadow:
    0 10px 22px rgba(39, 43, 49, 0.1),
    0 34px 70px rgba(39, 43, 49, 0.17);
}

.landing__panel .reasontag {
  font-size: 9px;
  border-width: 1.5px;
  border-radius: 3px;
  padding: 1px 6px;
}

/* Citations receipt panel */

.landing__mockcard--loose {
  padding: 12px 15px;
}

.landing__panelcourse {
  font-size: 13px;
}

.landing__panelcourse + .landing__mockmeta {
  margin-top: 5px;
  gap: 7px;
}

.landing__panelnote {
  font-size: 11px;
  color: rgba(39, 43, 49, 0.7);
}

.landing__panelcite {
  margin-top: 6px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  box-shadow: inset 0 -5px 0 rgba(217, 119, 6, 0.4);
  display: inline-block;
}

.landing__arrow {
  display: flex;
  justify-content: center;
  padding: 10px 0;
  font-weight: 900;
  font-size: 16px;
  color: rgba(39, 43, 49, 0.4);
}

.landing__receipt {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 3px 12px rgba(39, 43, 49, 0.1);
  padding: 14px 16px;
}

.landing__receipthead {
  font-weight: 700;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(39, 43, 49, 0.5);
}

.landing__receiptline {
  margin-top: 8px;
  font-size: 12.5px;
  line-height: 1.6;
  color: rgba(39, 43, 49, 0.85);
}

.landing__receiptquote {
  font-weight: 800;
  box-shadow: inset 0 -6px 0 rgba(14, 138, 109, 0.3);
}

.landing__receiptverified {
  margin-top: 8px;

  color: var(--hold-teal);

}

/* ============ Method band ============ */

.landing__band {
  background: #f7f5f0;
  clip-path: polygon(0 var(--fh-diag), 100% 0, 100% calc(100% - var(--fh-diag)), 0 100%);
  padding: 170px 0 190px;
}

.landing__feature--inband {
  padding: 0 36px;
}

.landing__panel--card {
  background: #fff;
  padding: 30px;
}

.landing__checks {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.landing__check {
  display: flex;
  align-items: center;
  gap: 11px;
}

.landing__check span:last-child {
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.landing__check .holdtile__bang {
  font-size: 12px;
}

.landing__checksfoot {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid rgba(39, 43, 49, 0.12);
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(39, 43, 49, 0.55);
}

/* ============ Petitions panel ============ */

.landing__flags {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.landing__flag {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
}

.landing__flagcheck {
  width: 16px;
  height: 16px;
  flex: none;
  background: var(--slate);
  border-radius: 3px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.landing__flagcode {
  font-weight: 800;
  font-size: 11.5px;
  width: 64px;
}

.landing__flagtitle {
  font-size: 10.5px;
  color: rgba(39, 43, 49, 0.7);
  flex: 1;
}

.landing__flag .reasontag {
  font-size: 8.5px;
  padding: 1px 5px;
}

.landing__receipt--letter {
  padding: 18px 20px;
}

.landing__letter {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.7;
  color: rgba(39, 43, 49, 0.85);
}

.landing__lettercite {
  box-shadow: inset 0 -5px 0 rgba(14, 138, 109, 0.3);
}

.landing__copychip {
  margin-top: 14px;
  display: inline-block;
  background: var(--slate);
  color: var(--chalk);
  font-weight: 800;
  font-size: 10.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 8px 14px;
  border-radius: 999px;
}

/* ============ Dark stat band ============ */

.landing__stakes {
  background: var(--slate);
  color: var(--chalk);
  clip-path: polygon(0 var(--fh-diag), 100% 0, 100% calc(100% - var(--fh-diag)), 0 100%);
  padding: 180px 0 200px;
}

.landing__stakesgrid {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 36px;
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 76px;
  align-items: center;
}

.landing__kicker--dark {
  color: #3fb08a;
}

.landing__stat {
  margin-top: 16px;
  font-weight: 900;
  font-size: 120px;
  line-height: 1;
  letter-spacing: -0.03em;
}

.landing__h2--stat {
  font-size: 32px;
  line-height: 1.15;
  letter-spacing: -0.01em;
}

.landing__body--dark {
  margin: 16px 0 0;
  font-size: 16px;
  color: rgba(243, 241, 236, 0.65);
  max-width: 460px;
}

.landing__walltitle {
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 0.13em;
  color: rgba(243, 241, 236, 0.6);
  margin-bottom: 14px;
}

.landing__wallcaption {
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 14px;
  line-height: 1.6;
  color: rgba(243, 241, 236, 0.75);
}

/* ============ Savings panel ============ */

.landing__panel--stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.landing__mockcard--rank {
  padding: 12px 15px;
  gap: 14px;
}

.landing__mockcard--rank .landing__mockcite {
  letter-spacing: 0.05em;
}

.landing__rank {
  font-weight: 900;
  font-size: 19px;
  width: 30px;
}

.landing__save {
  background: var(--hold-teal);
  color: var(--chalk);
  border: var(--border);
  border-radius: var(--radius);
  box-shadow: 2px 2px 0 var(--slate);
  padding: 7px 11px;
  text-align: center;
}

.landing__saveamount {
  font-weight: 900;
  font-size: 14px;
  line-height: 1;
}

.landing__savelabel {
  font-weight: 500;
  font-size: 7.5px;
  letter-spacing: 0.08em;
  margin-top: 2px;
}

/* ============ Final CTA + footer ============ */

.landing__final {
  background: #f7f5f0;
  clip-path: polygon(0 var(--fh-diag), 100% 0, 100% 100%, 0 100%);
  padding-top: 170px;
}

.landing__finalcopy {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 36px 90px;
  text-align: center;
}

.landing__h2--final {
  margin: 0;
  font-size: 48px;
  line-height: 1.06;
  letter-spacing: -0.02em;
}

.landing__body--final {
  margin: 18px auto 0;
  max-width: 480px;
  font-size: 16.5px;
  line-height: 1.6;
}

.landing__finalcta {
  margin-top: 28px;
}

.landing__fineprint {
  margin-top: 14px;
  font-size: 12px;
  color: rgba(39, 43, 49, 0.5);
}

.landing__footer {
  border-top: 1px solid rgba(39, 43, 49, 0.12);
}

.landing__footerrow {
  max-width: 1080px;
  margin: 0 auto;
  padding: 30px 36px;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}

.landing__brand--footer {
  gap: 8px;
}

.landing__brand--footer span {
  color: var(--slate);
  font-size: 14px;
}

.landing__footertag {
  font-size: 12.5px;
  color: rgba(39, 43, 49, 0.55);
}

.landing__footerlinks {
  display: flex;
  gap: 22px;
  margin-left: auto;
}

.landing__footerlinks a {
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(39, 43, 49, 0.6);
}

.landing__footerlinks a:hover {
  color: var(--slate);
}

.landing__provenance {
  font-size: 11px;
  color: rgba(39, 43, 49, 0.4);
}

/* ============ Responsive ============

   The export ships desktop-only; these max-width tiers scale the same design
   down without touching desktop rendering. Copy always precedes its panel
   once a feature grid collapses, matching the reading order of the two
   sections that already lead with copy. */

/* Tablet: two-column grids collapse. */
@media (max-width: 960px) {
  .landing__feature,
  .landing__stakesgrid {
    grid-template-columns: 1fr;
    gap: 44px;
  }

  .landing__feature--inband .landing__panel--card,
  .landing__panel--stack {
    order: 1;
  }

  .landing__body--dark {
    max-width: none;
  }
}

/* Phone: shallower diagonals, tighter rhythm, scaled display type. */
@media (max-width: 720px) {
  .landing {
    --fh-diag: 56px;
  }

  .landing__navlink {
    display: none;
  }

  .landing__herobody,
  .landing__mockwrap,
  .landing__proof,
  .landing__feature,
  .landing__feature--inband,
  .landing__stakesgrid,
  .landing__finalcopy,
  .landing__footerrow {
    padding-left: 22px;
    padding-right: 22px;
  }

  .landing__herocopy {
    margin-top: 48px;
  }

  .landing__hero {
    padding-bottom: 150px;
  }

  .landing__mockwrap {
    margin-top: -100px;
  }

  .landing__headline {
    font-size: 44px;
  }

  .landing__tagline {
    font-size: 16px;
  }

  .landing__proof {
    padding-top: 56px;
  }

  .landing__feature {
    padding-top: 72px;
    padding-bottom: 72px;
  }

  .landing__feature--inband {
    padding-top: 0;
    padding-bottom: 0;
  }

  .landing__band {
    padding: 110px 0 130px;
  }

  .landing__stakes {
    padding: 120px 0 140px;
  }

  .landing__final {
    padding-top: 110px;
  }

  .landing__h2 {
    font-size: 30px;
  }

  .landing__h2--stat {
    font-size: 26px;
  }

  .landing__h2--final {
    font-size: 34px;
  }

  .landing__stat {
    font-size: 88px;
  }
}

/* Narrow phone: the mockup flattens to a single rail. */
@media (max-width: 560px) {
  .landing__mockrow {
    margin-left: 0;
  }

  .landing__mockboard {
    padding: 16px 14px 18px;
  }

  .landing__mockbar {
    gap: 10px;
    padding: 10px 14px;
  }

  .landing__mockgrid {
    grid-template-columns: 1fr;
  }

  .landing__mockcell:first-child {
    border-right: 0;
    border-bottom: var(--border);
  }
}

@media (max-width: 440px) {
  .landing__headline {
    font-size: 36px;
  }

  .landing__stat {
    font-size: 68px;
  }

  .landing__h2--final {
    font-size: 30px;
  }
}
@keyframes fh-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.picker {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 34px;
  padding: 60px 32px;
  box-sizing: border-box;
  animation: fh-fade 0.4s both;
}

.picker__head {
  text-align: center;
}

.picker__head h1 {
  margin: 0;
  font-weight: 900;
  font-size: 54px;
  line-height: 1.08;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  max-width: 860px;
  text-wrap: pretty;
}

.picker__head p {
  margin: 16px auto 0;
  font-size: 16px;
  font-weight: 400;
  max-width: 640px;
  line-height: 1.55;
  color: rgba(39, 43, 49, 0.8);
}

.picker__pickers {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.picker__pick {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.picker__label {
  font-weight: 900;
  font-size: 10.5px;
  letter-spacing: 0.1em;
}

.picker__select {
  font-family: inherit;
  font-weight: 500;
  font-size: 14px;
  padding: 13px 14px;
  background: #fff;
  border: var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-offset);
  cursor: pointer;
  color: inherit;
}

.picker__select:disabled {
  background: rgba(255, 255, 255, 0.5);
  color: rgba(39, 43, 49, 0.5);
  box-shadow: none;
  cursor: default;
}

.picker__select--cc,
.picker__select--major {
  min-width: 230px;
  max-width: 300px;
}

.picker__select--target {
  min-width: 210px;
  max-width: 280px;
}

.picker__arrow {
  font-weight: 800;
  font-size: 20px;
  padding-bottom: 12px;
}

.picker__demo {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: -8px;
}

.picker__demo-hint {
  font-size: 13px;
  font-weight: 500;
  color: rgba(39, 43, 49, 0.65);
}

.picker__stats {
  text-align: center;
  margin-top: 10px;
}

.picker__stat {
  font-size: 13px;
  font-weight: 500;
}

.picker__gao {
  box-shadow: inset 0 -6px 0 rgba(217, 119, 6, 0.4);
}

.picker__gaoref {
  font-weight: 400;
  color: rgba(39, 43, 49, 0.6);
}

.picker__scale {
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 12px;
  color: rgba(39, 43, 49, 0.55);
}
.entry {
  min-height: 100vh;
  animation: fh-fade 0.4s both;
}

.entry__bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px;
  border-bottom: 2px solid var(--slate);
  background: var(--chalk);
}

.entry__context {
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.entry__back {
  font-weight: 800;
  font-size: 11.5px;
  letter-spacing: 0.07em;
  cursor: pointer;
}

.entry__main {
  max-width: 880px;
  margin: 0 auto;
  padding: 52px 28px 80px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

.entry__title {
  margin: 0;
  font-weight: 900;
  font-size: 34px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.entry__sub {
  margin: 8px 0 0;
  font-size: 14.5px;

.entry__chipwrap {

}

.entry__chipbox {

  border: var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-offset);
  padding: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 92px;

  box-sizing: border-box;

.entry__chip {

  background: var(--chalk);
  border: var(--border);

.theater {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 44px;
  padding: 60px 32px;
  box-sizing: border-box;
}

.theater__lines {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 440px;
}

.theater__row {
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0.3;
  transition: opacity 0.3s;
  min-height: 22px;
}

.theater__row--done {
  opacity: 1;
}

.theater__box {
  width: 22px;
  height: 22px;
  flex: none;
  background: var(--chalk);
  border: var(--border);
  border-radius: var(--radius);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

.theater__row--done .theater__box {
  background: var(--hold-teal);
}

.theater__mark {
  opacity: 0;
}

.theater__row--done .theater__mark {
  opacity: 1;
}

.theater__text {
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

  font-weight: 900;

  to {

function foil(label, opts) {
  opts = opts || {};
  var size = opts.size || "md";
  var frame = opts.frame || "slate";
  var finish = opts.finish || "gold";
  var shape = opts.shape || "tile";
  var cls = "foil foil--" + size + " foil--" + frame + " foil--" + finish + " foil--" + shape;

  return '<button class="' + cls + '"' +
    (opts.disabled ? " disabled" : "") +

    (opts.id ? ' id="' + opts.id + '"' : "") +
    (opts.title ? ' title="' + esc(opts.title) + '"' : "") + ">" +
    layers + '<span class="foil__label">' + esc(label) + "</span></button>";
}

function citationTag(citation, bucket, small) {
  return '<span class="citation citation--' + bucket + (small ? " citation--small" : "") + '">' +

function reasonTag(code) {

// Sheen/sweep timing tables copied from WallChart.tsx.
var SIDEBAR_SHEEN_DURATIONS = [6.2, 7.1, 5.8, 7.6, 6.6, 7.9];
var SIDEBAR_SHEEN_DELAYS = [0.6, 2.3, 1.1, 3.4, 1.9, 4.1];
var THEATER_WIDTHS = [58, 54, 54, 50, 54, 54, 46];
var THEATER_HEIGHTS = [52, 74, 96, 118, 140, 162, 188];
var THEATER_DELAYS = [0.1, 0.55, 1.0, 1.45, 1.9, 2.35, 2.8];
var THEATER_SWEEP_DURATIONS = [1.2, 1.15, 1.45, 1.25, 1.5, 1.3];
var THEATER_SWEEP_DELAYS = [0.25, 0.62, 1.08, 1.55, 1.98, 2.45];

function wallChart(steps, variant) {
  if (steps.length === 0) return "";
  var html = '<div class="wall wall--' + variant + '" id="wall-' + variant + '">';
  steps.forEach(function (step, i) {
    var style;
    if (variant === "sidebar") {
      style = "margin-left:" + 18 * i + "px;" +
        "animation-duration:0.35s," + SIDEBAR_SHEEN_DURATIONS[i % 6] + "s;" +
        "animation-delay:" + (0.1 + 0.2 * i).toFixed(1) + "s," + SIDEBAR_SHEEN_DELAYS[i % 6] + "s";
    } else if (variant === "landing") {
      style = "margin-left:" + 24 * i + "px;" +
        "animation-duration:0s," + SIDEBAR_SHEEN_DURATIONS[i % 6] + "s;" +
        "animation-delay:0s," + SIDEBAR_SHEEN_DELAYS[i % 6] + "s";
    } else {
      style = "width:" + THEATER_WIDTHS[i % 7] + "px;height:" + THEATER_HEIGHTS[i % 7] + "px;" +
        "animation-duration:0.45s," + THEATER_SWEEP_DURATIONS[i % 6] + "s;" +
        "animation-delay:" + THEATER_DELAYS[i % 7] + "s," + THEATER_SWEEP_DELAYS[i % 6] + "s";
    }
    html += '<div class="wall__step wall__step--' + step.kind + '" style="' + style + '"></div>';
  });
  return html + "</div>";
}

// The export's [data-fade] scroll reveal (Landing.tsx effect, ported).
function mountLanding() {
  var root = document.getElementById("landing");
  var els = Array.prototype.slice.call(root.querySelectorAll("[data-fade]"));
  var revealed = new WeakSet();
  var reveal = function (el) {
    revealed.add(el);
    el.style.opacity = "1";
    el.style.transform = "none";
  };
  var ioWorks = false;
  var io = new IntersectionObserver(function (entries) {
    if (!ioWorks) {
      ioWorks = true;
      els.forEach(function (el) {
        if (!revealed.has(el)) {
          el.style.opacity = "0";
          el.style.transform = "translateY(24px)";
        }
      });
    }
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        reveal(entry.target);
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(function (el) {
    el.style.transition = "opacity .7s ease, transform .7s ease";
    io.observe(el);
  });
  later(function () {
    if (!ioWorks) {
      io.disconnect();
      els.forEach(reveal);
    }
  }, 600);
}

function startRoute() {

  var sameSending = state.route && state.route.sending.assist_id === sending.assist_id;

// The paste path: extractCourseCodes + resolveCodes against the canned
// vocabulary, after the fixed round-trip delay (the product resolves every
// candidate through the autocomplete API before it can become a chip).
function resolveAndAdd(codes) {
  if (state.parsing) return;
  state.parsing = true;
  var gen = generation;
  later(function () {
    if (gen !== generation) return;
    state.parsing = false;
    var resolved = [], unresolved = [];
    codes.forEach(function (code) {
      if (CHIP_MAP[code]) { resolved.push(CHIP_MAP[code]); } else { unresolved.push(code); }
    });
    var taken = {};
    state.chips.forEach(function (chip) { taken[chip.course_code] = true; });
    resolved.forEach(function (chip) {
      if (!taken[chip.course_code]) {
        taken[chip.course_code] = true;
        state.chips.push(chip);
      }
    });
    state.parseMsg = parseMessage({ resolved: resolved, unresolved: unresolved });
    render();
  }, D(PARSE_MS));
}

  var gen = generation;

  // lines fill only from the (canned) response, like the product.
  later(function () {
    if (gen !== generation) return;
    state.evaluation = DATA.evaluation;
    if (prefersReducedMotion()) { go("triage"); return; }
    var lines = theaterLines(state.evaluation);

    later(function () {
      if (gen !== generation) return;
      go("triage");

// useCountUp port: cubic ease-out over the fixed duration; the final frame
// is exactly the deterministic total. Reduced motion renders it immediately.
function countUp(unitId, target, labelId, labelPrefix) {
  var unitEl = unitId ? document.getElementById(unitId) : null;
  var labelEl = labelId ? document.getElementById(labelId) : null;
  var paint = function (v) {
    if (unitEl) unitEl.textContent = formatUnits(Math.round(v * 10) / 10);
    if (labelEl) labelEl.textContent = labelPrefix + formatDollars(v);
  };
  if (prefersReducedMotion()) { paint(target); return; }
  var start = performance.now();
  var duration = D(COUNTUP_MS);
  var step = function (now) {
    var progress = Math.min(1, (now - start) / duration);
    var eased = 1 - Math.pow(1 - progress, 3);
    paint(target * eased);
    if (progress < 1) frame(step);
  };
  frame(step);
}

// The triage sidebar's ambient chance events (WallChart.tsx `nextEvent`),
// on a FIXED seed so takes are identical (the product uses Math.random; the
// replica must not - see the countdown assets' determinism rule).
function startChanceEvents() {
  var wall = document.getElementById("wall-sidebar");
  if (!wall) return;
  var rng = mulberry32(0x2026087);
  var reduced = function () { return prefersReducedMotion(); };
  var flash = function (el, d) {
    var orig = el.style.cssText;
    el.style.animation = "fh-stepin 0s both, fh-holoflash " +
      (0.9 + rng() * 0.6).toFixed(2) + "s ease-in-out " + d + "ms both";
    later(function () { el.style.cssText = orig; }, d + 1800);
  };
  var nextEvent = function () {
    later(function () {
      if (!reduced()) {
        var sheenSteps = Array.prototype.filter.call(wall.children, function (c) {
          return c.classList.contains("wall__step--secure") || c.classList.contains("wall__step--reach");
        });
        var roll = rng();
        if (sheenSteps.length) {
          if (roll < 0.45) {
            flash(sheenSteps[Math.floor(rng() * sheenSteps.length)]);
          } else if (roll < 0.75) {
            sheenSteps.forEach(function (el, i) { flash(el, i * 140); });
          } else {
            var el = sheenSteps[Math.floor(rng() * sheenSteps.length)];
            el.style.transition = "filter .25s ease, box-shadow .25s ease";
            el.style.filter = "brightness(1.7) saturate(1.6)";
            el.style.boxShadow = "0 0 14px rgba(255,255,255,.75)";
            later(function () { el.style.filter = ""; el.style.boxShadow = ""; }, 340);
          }
        }
      }
      nextEvent();
    }, 3500 + rng() * 5500);
  };
  nextEvent();
}

// The simulated petition POST + poll loop: debounce, then the fixed number
// of 1s polls before the canned letter "succeeds". Selection changes bump
// the generation exactly like the product's stale-response guard.
function scheduleDraft() {
  var d = state.drawer;
  generation += 1;
  var gen = generation;
  if (d.selected.length === 0) {
    d.kind = "empty";
    renderLetterCard();
    return;
  }
  d.kind = "drafting";
  renderLetterCard();
  later(function () {
    if (gen !== generation || !state.drawer) return;
    later(function () {
      if (gen !== generation || !state.drawer) return;
      state.drawer.kind = "letter";
      renderLetterCard();
    }, D(POLL_INTERVAL_MS) * LLM_POLLS);
  }, D(POST_DEBOUNCE_MS));
}

// The live-typing reveal, timing per lib/petition.ts: TYPE_CHARS_PER_TICK
// characters every TYPE_TICK_MS across the paragraph text (paragraph breaks
// are free); the caret rides the end of the last typed paragraph. The full
// letter is already in state - the copy button copies it verbatim.
function startTyping(body) {
  var holds = citedHolds(PETITION.cited, state.evaluation);
  var paragraphs = letterParagraphs(PETITION.letter_text);
  var segs = paragraphs.map(function (p) { return paragraphSegments(p, holds); });

  var makeSpan = function (seg) {
    var span = document.createElement("span");
    if (seg.hold !== null) span.className = "petition__cite petition__cite--" + seg.hold;
    return span;
  };

  if (prefersReducedMotion()) {
    segs.forEach(function (list) {
      var p = document.createElement("p");
      p.className = "petition__para";
      list.forEach(function (seg) {
        var span = makeSpan(seg);
        span.textContent = seg.text;
        p.appendChild(span);
      });
      body.appendChild(p);
    });
    return;
  }

  var caret = document.createElement("span");
  caret.className = "petition__caret";
  caret.setAttribute("aria-hidden", "true");
  var pIdx = 0, sIdx = 0, cIdx = 0;
  var currentP = null, currentSpan = null;
  var gen = generation;
  var timer = everyTick(function () {
    if (gen !== generation) { clearInterval(timer); return; }
    var budget = TYPE_CHARS_PER_TICK;
    while (budget > 0 && pIdx < segs.length) {
      if (currentP === null) {
        currentP = document.createElement("p");
        currentP.className = "petition__para";
        currentP.appendChild(caret);
        body.appendChild(currentP);
      }
      if (sIdx >= segs[pIdx].length) {
        pIdx += 1; sIdx = 0; cIdx = 0;
        currentP = null; currentSpan = null;
        continue;
      }
      var seg = segs[pIdx][sIdx];
      if (currentSpan === null) {
        currentSpan = makeSpan(seg);
        currentP.insertBefore(currentSpan, caret);
      }
      var take = Math.min(budget, seg.text.length - cIdx);
      currentSpan.textContent += seg.text.slice(cIdx, cIdx + take);
      cIdx += take;
      budget -= take;
      if (cIdx >= seg.text.length) { currentSpan = null; sIdx += 1; cIdx = 0; }
    }
    if (pIdx >= segs.length) {
      caret.remove();
      clearInterval(timer);
    }
  }, D(TYPE_TICK_MS));
}

function copyLetter() {
  var d = state.drawer;
  if (!d || d.kind !== "letter") return;
  var done = function () {
    d.copied = true;
    var btn = document.getElementById("petition-copy");
    if (btn) btn.textContent = "Copied";
    later(function () {
      if (!state.drawer) return;
      state.drawer.copied = false;
      var b = document.getElementById("petition-copy");
      if (b) b.textContent = "Copy letter";
    }, 1500);
  };
  copyText(PETITION.letter_text, done);
}

function copyText(text, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { execCopy(text); done(); });
  } else {
    execCopy(text);
    done();
  }
}

function execCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
}

/* ==================================================================== */
/* Foil sheen - FoilButton.tsx `onMove`, one delegated listener           */
/* ==================================================================== */

var foilRaf = 0;
document.addEventListener("mousemove", function (event) {
  cancelAnimationFrame(foilRaf);
  foilRaf = requestAnimationFrame(function () {
    var buttons = document.querySelectorAll(".foil:not(:disabled)");
    for (var i = 0; i < buttons.length; i++) {
      var el = buttons[i];
      var r = el.getBoundingClientRect();
      if (!r.width) continue;
      var nx = (event.clientX - r.left) / r.width;
      var ny = (event.clientY - r.top) / r.height;
      var dx = Math.max(r.left - event.clientX, 0, event.clientX - r.right);
      var dy = Math.max(r.top - event.clientY, 0, event.clientY - r.bottom);
      var influence = Math.max(0, 1 - Math.hypot(dx, dy) / 180);
      el.style.setProperty("--ft", ".12s");
      el.style.setProperty("--rx", ((0.5 - ny) * 5 * influence).toFixed(2) + "deg");
      el.style.setProperty("--ry", ((nx - 0.5) * 7 * influence).toFixed(2) + "deg");
      el.style.setProperty("--mx", (50 + (nx * 100 - 50) * influence).toFixed(1) + "%");
      el.style.setProperty("--my", (50 + (ny * 100 - 50) * influence).toFixed(1) + "%");
      el.style.setProperty("--ga", (100 + (nx - 0.5) * 40 * influence).toFixed(1) + "deg");
    }
  });
});

/* ==================================================================== */
/* Event wiring                                                          */
/* ==================================================================== */

document.addEventListener("click", function (event) {
  var target = event.target.closest("[data-action]");
  if (!target) return;
  var action = target.getAttribute("data-action");
  if (action === "enter-picker" || action === "back-picker") { go("picker"); }
  else if (action === "start-route") { startRoute(); }
  else if (action === "roll-demo") { /* inert in the replica: presets need the live index */ }
  else if (action === "sample") {
    resolveAndAdd(DATA.chips.map(function (chip) { return chip.course_code; }));
  }
  else if (action === "parse") { resolveAndAdd(extractCourseCodes(state.paste)); }
  else if (action === "remove-chip") {
    var code = target.getAttribute("data-code");
    state.chips = state.chips.filter(function (chip) { return chip.course_code !== code; });
    render();
  }
  else if (action === "evaluate") { state.evaluation = null; go("theater"); }
  else if (action === "edit-courses") { go("entry"); }
  else if (action === "open-drawer") { openDrawer(); }
  else if (action === "close-drawer") { closeDrawer(); }
  else if (action === "toggle-item") {
    var pos = parseInt(target.getAttribute("data-pos"), 10);
    state.drawer.selected = toggleSelection(state.drawer.selected, pos);
    state.drawer.copied = false;
    renderDrawer(false);
    scheduleDraft();
  }
  else if (action === "copy-letter") { copyLetter(); }
});

document.addEventListener("change", function (event) {
  var select = event.target.closest("[data-select]");
  if (!select) return;
  pickerChanged(select.getAttribute("data-select"), select.value);
});

/* ==================================================================== */
/* Operator controls                                                     */
/* ==================================================================== */

var hint = document.getElementById("hint");
var hintTimer = null;
var HINT_TEXT = "R reset · 1 landing · 2 picker · 3 entry · 4 triage · 5 petition · T copy transcript";

function showHint(text) {
  hint.textContent = text || HINT_TEXT;
  clearTimeout(hintTimer);
  hint.classList.remove("off");
  hintTimer = setTimeout(function () { hint.classList.add("off"); }, 5000);
}

function jumpTo(stage) {
  state = freshState();
  clearScheduled();
  if (stage === "landing") { state.screen = "landing"; }
  else if (stage === "picker") { state.screen = "picker"; }
  else if (stage === "entry") {
    state.route = MAYA_ROUTE;
    state.screen = "entry";
  }
  else if (stage === "triage" || stage === "petition") {
    state.route = MAYA_ROUTE;
    state.chips = DATA.chips.slice();
    state.evaluation = DATA.evaluation;
    state.screen = "triage";
  }
  render();
  window.scrollTo(0, 0);
  if (stage === "petition") { openDrawer(); }
}

document.addEventListener("keydown", function (event) {
  var tag = event.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  var key = event.key.toLowerCase();
  if (key === "r" || key === "1") { jumpTo("landing"); }
  else if (key === "2") { jumpTo("picker"); }
  else if (key === "3") { jumpTo("entry"); }
  else if (key === "4") { jumpTo("triage"); }
  else if (key === "5") { jumpTo("petition"); }
  else if (key === "t") { copyText(TRANSCRIPT, function () { showHint("Transcript copied - paste it into the entry screen"); }); }
  else if (key === "h") { showHint(); }
});

/* ==================================================================== */
/* Boot                                                                  */
/* ==================================================================== */

state = freshState();
render();
showHint();
</script>
